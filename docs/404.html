<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141A30">
<meta name="robots" content="noindex">
<title>Patika bulunamadı — Büyükkol</title>
<script>
  // GitHub Pages bu sayfayı her derinlikte gösterir; göreli yollar için kökü belirle.
  // /portfoy/ altında yayındaysa oraya, kendi alan adında köke bağlan.
  (function () {
    var root = location.pathname.indexOf('/portfoy/') === 0 || location.pathname === '/portfoy' ? '/portfoy/' : '/';
    document.write('<base href="' + root + '">');
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23141A30'/%3E%3Crect x='6' y='4' width='4' height='7' fill='%23FFD66B'/%3E%3Crect x='7' y='2' width='2' height='2' fill='%23C9C3D9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.stage{position:relative;flex:1 1 auto;min-height:300px;overflow:hidden;overflow:clip;background:#141A30}
.scene{position:absolute;left:0;bottom:0;image-rendering:pixelated}
.lost{position:absolute;left:0;right:0;top:0;padding:clamp(28px,7vh,72px) calc(20px + env(safe-area-inset-left)) 0;z-index:2;text-align:center;pointer-events:none}
.lost p{margin:0 auto;max-width:34ch}
.code{font-family:var(--pixel);font-size:14px;letter-spacing:.14em;color:#FFD66B}
.lost h1{font-family:var(--display);font-size:clamp(30px,6vw,52px);line-height:1.08;margin:10px 0 12px;text-shadow:0 2px 0 rgba(14,16,30,.6)}
.lost .muted{color:#E4DDEC;text-shadow:0 1px 0 rgba(14,16,30,.9)}
.go{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px;pointer-events:auto}
.btn.ghost{background:rgba(20,26,48,.72);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.ghost:hover{background:rgba(27,34,64,.9);color:#fff}
</style>
</head>
<body>
<main class="stage" id="stage">
<canvas class="scene" id="scene" role="img" aria-label="Gece, piksel bir ormanda kulübenin önünde fener taşıyan gezgin."></canvas>
<div class="lost">
<p class="code">404 · PATİKA YOK</p>
<h1>Bu patika ormanda yok.</h1>
<p class="muted">Belki ağaçlar yer değiştirdi, belki adres biraz yanlış yazıldı. Fenerini al, kulübeye dönelim.</p>
<div class="go">
<a class="btn" href="index.html#kulube">Kulübeye dön</a>
<a class="btn ghost" href="hakkimda.html">Hakkımda</a>
</div>
</div>
</main>
<script src="engine.js"></script>
<script>
"use strict";
(function () {
  const cv = document.getElementById('scene');
  if (!window.BuyukkolEngine || !cv.getContext) return;
  const eng = new window.BuyukkolEngine();
  const game = eng.buildGame(cv, { onZone: function () {} }, eng.buildAudio());
  game.jump(0);
})();
</script>
</body>
</html>
